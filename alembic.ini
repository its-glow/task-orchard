# Used only for authoring migrations from the command line:
#   TASK_ORCHARD_DB=dev.db uv run alembic upgrade head
#   TASK_ORCHARD_DB=dev.db uv run alembic revision --autogenerate -m "what changed"
# At runtime the application configures Alembic itself (db/engine.py).
[alembic]
script_location = src/task_orchard/db/migrations
file_template = %%(rev)s_%%(slug)s
