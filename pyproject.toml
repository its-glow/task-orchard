[project]
name = "task-orchard"
version = "0.1.0"
description = "A task and time management service with an MCP interface. The server computes facts; the agent makes judgements."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastmcp>=2.0",
    "pydantic>=2.6",
    "python-dateutil>=2.9",
    "sqlalchemy>=2.0",
]

[project.scripts]
task-orchard = "task_orchard.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/task_orchard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated constraint strings are long and should stay on one line.
"src/task_orchard/db/migrations/versions/*" = ["E501"]
